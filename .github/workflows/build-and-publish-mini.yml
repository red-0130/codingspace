name: Build and Publish Mini Image

on:
  workflow_dispatch:

  push:
    branches: ["main", "mini"]
  schedule:
    # Runs every Thursday @ 2:00
    - cron: "0 2 */14 * *"

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mini branch
        uses: actions/checkout@v4
        with:
          ref: mini

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=mini

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test core tools
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:mini node -v
          docker run --rm ghcr.io/${{ github.repository }}:mini npm -v
          docker run --rm ghcr.io/${{ github.repository }}:mini bun -v
          docker run --rm ghcr.io/${{ github.repository }}:mini python3 --version
          docker run --rm ghcr.io/${{ github.repository }}:mini uv --version
          docker run --rm ghcr.io/${{ github.repository }}:mini uvx --version

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:mini
